name: stretch-thu-observability-router Autograder

on:
  push:
    branches:
      - main
      - stretch-thu-observability-router
  pull_request:
    branches:
      - main

jobs:
  autograder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate docker-compose-stretch.yml
        run: |
          docker compose -f docker-compose-stretch.yml config

      - name: Run autograder tests
        run: |
          pytest tests/ -v --tb=short
